# Local / VM deployment with a load balancer.
#   docker compose up --build                 -> 1 API container
#   docker compose up -d --scale api=3        -> 3 API containers behind nginx
# UI:  http://localhost:8501     API (via nginx): http://localhost:8080/docs
services:
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment:
      - AUTO_RETRAIN=false
    volumes:                       # shared so every replica sees the same model + uploads
      - ./models:/app/models
      - ./data:/app/data
    expose: ["8000"]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["8080:80"]
    depends_on: [api]

  ui:
    build: { context: ., dockerfile: Dockerfile.ui }
    environment:
      - API_URL=http://nginx
    ports: ["8501:8501"]
    depends_on: [nginx]
