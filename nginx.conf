# Docker's embedded DNS returns every replica's IP for "api"; re-resolving
# (variable in proxy_pass) lets nginx round-robin across scaled containers.
resolver 127.0.0.11 valid=5s;

server {
    listen 80;
    client_max_body_size 100m;

    location / {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
    }
}
